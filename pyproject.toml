[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "record-conformal"
version = "0.1.0"
description = "Region-level conformal risk control for semantic segmentation under distribution shift"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ulas Yurtsever" }]
# Kept in step with requirements.txt, which carries the rationale for each pin.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.46,<5",
    "timm>=1.0",
    "open_clip_torch>=2.24",
    "rasterio>=1.3",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
